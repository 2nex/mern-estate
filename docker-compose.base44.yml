services:
  mongo:
    image: mongo:7
    restart: on-failure
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - api_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      MONGO: mongodb://mongo:27017/smithestate
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --legacy-watch"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/user/test', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app/client
    volumes:
      - .:/app
      - client_modules:/app/client/node_modules
    ports:
      - "3000:5173"
    env_file:
      - /run/base44/app.env
    environment:
      API_PROXY_TARGET: http://api:3000
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  mongo_data:
  api_modules:
  client_modules:
